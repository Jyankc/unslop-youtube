<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unslop YouTube</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <p class="eyebrow">LESS NOISE. MORE INTENTION.</p>
  <h1>Unslop YouTube</h1>
  <p>Search for what you came for.</p>
  <label class="setting">
    <span>Quiet mode</span>
    <input id="enabled" type="checkbox" role="switch" checked disabled>
  </label>
  <p id="status" role="status">Loading…</p>
  <a href="https://www.youtube.com/" target="_blank" rel="noreferrer">Open YouTube ↗</a>
</body>
</html>
